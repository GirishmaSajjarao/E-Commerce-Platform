services:
  mongo:
    image: mongo:7.0.14
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if (!rs.status().ok) quit(1) } catch (_) { if (!rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"127.0.0.1:27017\"}]}).ok) quit(1) }'"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
