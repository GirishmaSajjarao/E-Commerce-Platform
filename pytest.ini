[pytest]
testpaths = tests api_tests automation/tests
python_files = test_*.py
addopts = -ra --strict-markers --html=reports/pytest_report.html --self-contained-html
markers =
    unit: fast isolated tests
    integration: tests using the FastAPI app and SQLite in-process
    api: REST API tests with Python Requests against a live test server
    functional: end-to-end chatbot behaviour (in-process)
    regression: guards for bugs/rules that must never come back
    llm_eval: LLM evaluation framework tests
    security: AI security tests
    ui: Playwright browser tests (need: playwright install chromium)
    live_llm: needs a real LLM (GEMINI_API_KEY and MOCK_MODE=false); skipped otherwise
log_file = logs/pytest.log
log_file_level = INFO
filterwarnings =
    ignore::DeprecationWarning
