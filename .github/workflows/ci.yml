name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  offline-tests:
    name: Unit, integration, API, functional, regression, offline LLM/security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install deepeval==4.3.2
          pip install --no-deps ragas==0.4.3
          pip install -r requirements-eval.txt
      - name: Run offline tests (no API key needed)
        env: { MOCK_MODE: "true", RECORD_RESULTS: "0" }
        run: pytest -m "not live_llm and not ui" --html=reports/offline_report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: offline-test-reports, path: "reports/\nlogs/" }

  ui-tests:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install dependencies and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install deepeval==4.3.2
          pip install --no-deps ragas==0.4.3
          pip install -r requirements-eval.txt
          python -m playwright install --with-deps chromium
      - name: Run Playwright tests
        env: { MOCK_MODE: "true", RECORD_RESULTS: "0" }
        run: pytest -m ui --html=reports/ui_report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-test-reports-and-screenshots, path: "reports/\nlogs/" }

  promptfoo:
    name: Promptfoo (deterministic suite, mock chatbot)
    runs-on: ubuntu-latest
    continue-on-error: true        # findings are reported, they do not block the build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - name: Start backend (mock mode)
        env: { MOCK_MODE: "true" }
        run: |
          nohup python run_app.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break || sleep 1; done
      - name: Run Promptfoo
        working-directory: evaluation/promptfoo
        env:
          BACKEND_URL: http://127.0.0.1:8000
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_PYTHON: python
        run: npx --yes promptfoo@0.125.1 eval -c promptfooconfig.yaml -o ../../reports/promptfoo_result.json --no-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: promptfoo-results, path: "reports/promptfoo_result.json\nserver.log" }

  live-llm-evaluation:
    name: Live LLM evaluation (runs only when GEMINI_API_KEY secret exists)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check for credentials
        id: gate
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "No GEMINI_API_KEY secret: skipping live evaluation (this is not a failure)."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          pip install deepeval==4.3.2
          pip install --no-deps ragas==0.4.3
          pip install -r requirements-eval.txt
      - name: Live security + DeepEval smoke tests
        if: steps.gate.outputs.run == 'true'
        env: { RECORD_RESULTS: "0" }
        run: pytest -m live_llm --html=reports/live_llm_report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with: { name: live-llm-reports, path: reports/ }
