<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Support Chatbot · AI Support QA</title><link rel="stylesheet" href="css/style.css"></head><body>
<script src="assets/chart.umd.js"></script><script src="js/app.js"></script>
<script>
(async () => {
if (!await shell("chatbot", "Customer Support Chatbot")) return;
const C = $("#content");

const u = me(); let convId = null;
C.innerHTML = `<div class="card row" style="margin-bottom:12px">${u.role === "admin" ? `<label>Chat as customer (QA impersonation)<select id="as-cust"><option value="">No customer (logged-out visitor)</option><option value="C001" selected>C001 · Alice</option><option value="C002">C002 · Bob</option><option value="C003">C003 · Carol</option></select></label>` : `<span>Signed in as customer <b>${esc(u.customer_id)}</b>. Ask about products, your orders, returns, refunds, payments and delivery.</span>`}
<label class="muted">Tip: try “What is the status of ORD-1002?”</label></div>
<div class="chat"><div class="card convs"><button class="primary" id="new-conv">+ New conversation</button><div id="conv-list"></div></div>
<div class="card pane"><div class="msgs" id="msgs" data-testid="messages"></div><div class="composer"><input id="chat-input" placeholder="Type your question…" maxlength="2000" autocomplete="off"><button class="primary" id="send-btn">Send</button></div></div></div>`;
const msgs = $("#msgs");
function addMsg(m) {
  const d = document.createElement("div"); d.className = "msg " + m.role;
  const ctx = m.retrieved_context && m.retrieved_context.length ? `<details><summary>Retrieved context (${m.retrieved_context.length})</summary><pre>${esc(m.retrieved_context.map(c => "• " + c.text).join("\n"))}</pre></details>` : "";
  d.innerHTML = `${esc(m.content)}${m.role === "assistant" ? `<small>${m.is_mock ? mockTag(true) + " " : ""}${m.guard_redacted ? "PII guard redacted text · " : ""}${m.latency_ms != null ? Math.round(m.latency_ms) + " ms" : ""}</small>${ctx}` : ""}`;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
}
async function loadConvs(select) {
  const list = await api("/conversations");
  $("#conv-list").innerHTML = list.map(c => `<button data-id="${c.id}" class="${c.id === convId ? "active" : ""}">${esc(c.title)}</button>`).join("");
  document.querySelectorAll("#conv-list button").forEach(b => b.onclick = () => openConv(b.dataset.id));
  if (select && list.length) openConv(list[0].id);
}
async function openConv(id) {
  convId = id; msgs.innerHTML = ""; clearError();
  try { (await api(`/conversations/${id}/messages`)).forEach(addMsg); } catch (e) { showError(e.message); }
  document.querySelectorAll("#conv-list button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
}
async function newConv() { const c = await api("/conversations", {method: "POST", body: {}}); convId = c.id; msgs.innerHTML = ""; await loadConvs(false); document.querySelector(`#conv-list button[data-id="${c.id}"]`)?.classList.add("active"); }
async function send() {
  const input = $("#chat-input"), text = input.value.trim(); if (!text) return;
  clearError(); $("#send-btn").disabled = true; input.value = "";
  try {
    if (!convId) await newConv();
    addMsg({role: "user", content: text});
    const typing = addMsg({role: "assistant", content: "…"});
    try {
      const as = $("#as-cust");
      const r = await api(`/conversations/${convId}/messages`, {method: "POST", body: {content: text, as_customer_id: as && as.value ? as.value : null}});
      typing.remove(); addMsg(r); loadConvs(false);
    } catch (e) { typing.remove(); showError(e.message); }
  } catch (e) { showError(e.message); } finally { $("#send-btn").disabled = false; input.focus(); }
}
$("#send-btn").onclick = send; $("#chat-input").onkeydown = e => { if (e.key === "Enter") send(); }; $("#new-conv").onclick = () => newConv().catch(e => showError(e.message));
loadConvs(true).catch(e => showError(e.message));

})();
</script></body></html>
